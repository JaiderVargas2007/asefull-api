# Entorno local completo: API + base de datos de prueba (+ phpMyAdmin opcional)
#   docker compose up --build
#   API:        http://localhost:3000/api/salud
#   phpMyAdmin: docker compose --profile admin up   ->  http://localhost:8080
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_123}
      MARIADB_DATABASE: asefull_demo
      MARIADB_USER: asefull
      MARIADB_PASSWORD: ${DB_PASSWORD:-asefull_local_123}
      TZ: America/Bogota
    volumes:
      - datos_db:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: asefull
      DB_PASSWORD: ${DB_PASSWORD:-asefull_local_123}
      DB_NAME: asefull_demo
      JWT_SECRET: ${JWT_SECRET:-solo-local-cambiar-en-produccion-0123456789abcdef}
      JWT_EXPIRES_IN: 8h
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["admin"]
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db

volumes:
  datos_db:
